# This file lists tools managed by Aftman, a cross-platform toolchain manager.
# For more information, see https://github.com/LPGhatguy/aftman

# To add a new tool, add an entry to this table.
[tools]
rojo = "rojo-rbx/rojo@7.7.0"
wally = "UpliftGames/wally@0.3.2"
selene = "Kampfkarren/selene@0.31.0"
# Both spellings: the alias on disk is StyLua.exe, and aftman matches the manifest key against
# argv[0] case-sensitively, so a shell that resolves `stylua` to StyLua.exe needs the capitalised
# key to exist too.
stylua = "JohnnyMorganz/StyLua@2.5.2"
StyLua = "JohnnyMorganz/StyLua@2.5.2"
luau-lsp = "JohnnyMorganz/luau-lsp@1.69.0"
# runs the game headless: the AI arena, the tests, the tools that read the game's numbers (tools/lib)
lune = "lune-org/lune@0.10.4"
